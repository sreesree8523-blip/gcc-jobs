name: Collect GCC jobs

on:
  schedule:
    # 6:00 AM IST, with a 7:40 AM IST backup (GitHub sometimes delays or skips scheduled runs)
    - cron: "30 0 * * *"
    - cron: "10 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "companies.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect jobs
        run: python scripts/collect.py
      - name: Save today's list
        run: |
          git config user.name "gcc-jobs-bot"
          git config user.email "gcc-jobs-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "Jobs update $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Send phone notification
        continue-on-error: true
        run: |
          python scripts/notify.py
          git add docs/data/notify_state.json
          git commit -m "Notified" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Alert if the refresh failed
        if: failure()
        run: python scripts/notify.py failed
