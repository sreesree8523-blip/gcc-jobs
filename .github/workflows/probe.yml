name: Probe company feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/candidates.json"
      - "tools/probe.py"
      - "scripts/sources.py"

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe
        run: python tools/probe.py
      - name: Save results
        run: |
          git config user.name "gcc-jobs-bot"
          git config user.email "gcc-jobs-bot@users.noreply.github.com"
          git add tools/probe_results.json
          git commit -m "Probe results" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
